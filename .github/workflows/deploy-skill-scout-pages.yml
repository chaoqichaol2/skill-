name: Deprecated Skill Scout GitHub Pages Deployment

# The private dashboard is deployed by Vercel. This legacy workflow is kept
# only as migration history and no longer runs on pushes or pull requests.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "GitHub Pages deployment is disabled."
