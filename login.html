<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>灵感 Radar Console - 登录</title>
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card" aria-labelledby="loginTitle">
        <a class="console-brand" href="./index.html" aria-label="灵感 Radar 首页">
          <img class="console-logo" src="./assets/linggan-radar-logo.png" alt="灵感 Radar" />
        </a>

        <div>
          <p class="eyebrow">ADMIN ACCESS</p>
          <h1 id="loginTitle">管理员登录</h1>
        </div>

        <form class="login-form" id="loginForm">
          <label>
            <span>账号</span>
            <input id="username" name="username" type="text" autocomplete="username" required />
          </label>

          <label>
            <span>密码</span>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </label>

          <p class="login-error" id="loginError" role="alert"></p>

          <button class="primary-button login-submit" type="submit">登录控制台</button>
        </form>
      </section>
    </main>

    <script src="./login.js"></script>
  </body>
</html>
