<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSD 可编辑导入</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      color: #1f2329;
      background: #f7f8fa;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1 { margin: 0 0 6px; font-size: 18px; }
    .subtitle { margin: 0 0 18px; color: #646a73; }
    #drop-zone {
      position: relative;
      display: grid;
      min-height: 190px;
      padding: 24px;
      place-items: center;
      text-align: center;
      background: #fff;
      border: 1.5px dashed #bbbfc4;
      border-radius: 12px;
      cursor: pointer;
      transition: .16s ease;
    }
    #drop-zone:hover, #drop-zone.dragging { border-color: #3370ff; background: #f2f6ff; }
    #drop-zone.busy { cursor: progress; opacity: .72; }
    .icon { font-size: 34px; }
    .primary { margin-top: 8px; font-weight: 600; }
    .secondary { margin-top: 4px; color: #8f959e; font-size: 12px; }
    #file-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    #file-input:disabled { cursor: progress; }
    #status {
      margin-top: 16px;
      padding: 10px 12px;
      color: #646a73;
      background: #fff;
      border: 1px solid #e4e6e8;
      border-radius: 8px;
    }
    #status[data-tone="success"] { color: #16813d; background: #f0fff5; border-color: #b7ebc6; }
    #status[data-tone="error"] { color: #c02b2b; background: #fff3f3; border-color: #ffc6c6; }
    #details { margin-top: 10px; color: #646a73; white-space: pre-wrap; }
    .scope {
      margin-top: 18px;
      padding-top: 14px;
      color: #8f959e;
      border-top: 1px solid #e4e6e8;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>PSD 可编辑导入</h1>
  <p class="subtitle">导入图层结构，普通文字会转为可编辑文本。</p>
  <label id="drop-zone" for="file-input">
    <div>
      <div class="icon">🗂️</div>
      <div class="primary">点击选择或拖入 PSD 文件</div>
      <div class="secondary">文件只在本地解析，不会上传</div>
    </div>
    <input id="file-input" type="file" accept=".psd,image/vnd.adobe.photoshop">
  </label>
  <div id="status">等待选择文件</div>
  <div id="details"></div>
  <div class="scope">MVP 支持：图层组、位图、普通文本、基础透明度和混合模式。复杂滤镜和智能对象会按位图处理。</div>
  <script>/*__UI_SCRIPT__*/</script>
</body>
</html>
